<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="glow" cx="30%" cy="14%" r="80%">
      <stop offset="0%" stop-color="#6D001A" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#6D001A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
